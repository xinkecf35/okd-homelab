apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openebs-local-pv-privileged-scc
rules:
  - apiGroups:
      - security.openshift.io
    resourceNames:
      - privileged
    resources:
      - securitycontextconstraints
    verbs:
      - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openebs-local-pv-privileged-scc-rb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openebs-local-pv-privileged-scc
subjects:
  - kind: ServiceAccount
    name: openebs-local-pv-provisioner
