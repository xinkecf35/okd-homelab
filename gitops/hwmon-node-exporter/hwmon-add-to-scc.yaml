apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hwmon-node-exporter
rules:
  - apiGroups:
      - security.openshift.io
    resourceNames:
      - node-exporter
    resources:
      - securitycontextconstraints
    verbs:
      - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hwmon-node-exporter-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hwmon-node-exporter
subjects:
  - kind: ServiceAccount
    name: hwmon-node-exporter
