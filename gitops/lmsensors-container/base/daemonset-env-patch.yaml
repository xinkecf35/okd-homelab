apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: lmsensors
spec:
  selector:
    matchLabels:
      name: lmsensors
  template:
    metadata:
      labels:
        name: lmsensors
    spec:
      serviceAccountName: sensordash
      containers:
        - name: lmsensors
          env:
            - name: TZ
              value: "America/New_York"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
