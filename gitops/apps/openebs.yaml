apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openebs
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://openebs.github.io/openebs
      chart: openebs
      releaseName: openebs
      targetRevision: v4.6.0
      helm:
        valueFiles:
          - $values/gitops/openebs/helm/values.yaml
    - repoURL: https://github.com/xinkecf35/okd-homelab.git
      revision: main
      ref: values
    - repoURL: https://github.com/xinkecf35/okd-homelab.git
      revision: main
      path: gitops/openebs
      kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: openebs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - CreateNamespace=true
