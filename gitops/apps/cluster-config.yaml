apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-config
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/xinkecf35/okd-homelab.git
      revision: main
      path: gitops/cluster-config
      kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-config
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
